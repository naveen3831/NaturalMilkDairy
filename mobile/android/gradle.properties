org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Gradle daemon to prevent stale lock file issues ("Timeout waiting to lock build logic queue")
org.gradle.daemon=false
# Disable parallel builds to avoid concurrent Gradle instance conflicts
org.gradle.parallel=false

android.builtInKotlin=false
android.newDsl=false
